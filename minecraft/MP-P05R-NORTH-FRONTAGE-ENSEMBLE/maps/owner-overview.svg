<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><rect width="100%" height="100%" fill="#f7f2e8"/><text x="30" y="35" font-size="24" font-family="sans-serif">MP-P05R｜北侧两户混合前沿（规划示意，非建筑平面）</text><g transform="translate(70 80) scale(5)"><polygon points="0,0 46,1 50,23 34,43 7,41 0,21" fill="#ddd3bd" stroke="#594b3d" stroke-width=".5"/><polygon points="2,2 18,0 20,7 12,10 3,12" fill="#c9ddec" stroke="#256080"/><polygon points="23,1 44,3 45,8 37,11 31,6 25,6" fill="#d9c5a2" stroke="#8a5a2b"/><polygon points="9,16 34,12 39,25 30,34 12,34 4,27" fill="#f1d88a" stroke="#9b7417"/><polygon points="9,29 27,30 35,36 7,37" fill="#b9d8b0" stroke="#3f7043"/><polyline points="1,33 14,29 25,24 39,18 50,12" fill="none" stroke="#b23b32" stroke-width=".9"/><polyline points="39,13 47,10 53,8" fill="none" stroke="#315a9b" stroke-width=".7"/><polyline points="8,40 22,41 37,42 46,30 49,15" fill="none" stroke="#704c8b" stroke-width=".6" stroke-dasharray="2 1"/><g font-family="sans-serif" font-size="2.2" fill="#222"><text x="3" y="5">NF-01 低肩修理/值守</text><text x="25" y="5">NF-02 上沿复核/短宿</text><text x="13" y="23">SPACE-01 卸载—复核共同院</text><text x="10" y="33">公共门前与轮候缓冲</text><text x="39" y="12">东向轻载</text></g></g><g font-family="sans-serif" font-size="16"><text x="70" y="560" fill="#b23b32">红：西接卸载口</text><text x="260" y="560" fill="#315a9b">蓝：东向轻载横通（接 P04 ROUTE-02）</text><text x="600" y="560" fill="#704c8b">紫虚线：后侧服务巷</text><text x="70" y="590">地块色块仅表示规划关系；前沿不是墙线，公共空间不得被私人扩建占用。</text></g></svg>
