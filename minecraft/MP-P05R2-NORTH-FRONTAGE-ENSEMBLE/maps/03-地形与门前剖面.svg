34</text><path d="M880,701 h630" stroke="#c7ceca"/><text x="844" y="706" font-size="14" fill="#203342" font-weight="400">136</text><path d="M880,657 h630" stroke="#c7ceca"/><text x="844" y="662" font-size="14" fill="#203342" font-weight="400">138</text><rect x="1160" y="590" width="35" height="25" fill="#d48666"/><rect x="1195" y="590" width="35" height="25" fill="#d48666"/><rect x="950" y="590" width="35" height="25" fill="#d6a751"/><rect x="985" y="590" width="35" height="25" fill="#d6a751"/><rect x="1020" y="590" width="35" height="25" fill="#d6a751"/><rect x="1055" y="590" width="35" height="25" fill="#d6a751"/><rect x="1090" y="590" width="35" height="25" fill="#d6a751"/><rect x="1125" y="590" width="35" height="25" fill="#d6a751"/><polyline points="880,701 915,701 950,701 985,701 1020,701 1055,701 1090,701 1125,701 1160,701 1195,701 1230,701 1265,701 1300,701 1335,701 1370,701 1405,701 1440,701 1475,701 1510,701" fill="none" stroke="#355c55" stroke-width="4"/><text x="862" y="881" font-size="14" fill="#203342" font-weight="400">1625</text><text x="1002" y="881" font-size="14" fill="#203342" font-weight="400">1629</text><text x="1142" y="881" font-size="14" fill="#203342" font-weight="400">1633</text><text x="1282" y="881" font-size="14" fill="#203342" font-weight="400">1637</text><text x="1422" y="881" font-size="14" fill="#203342" font-weight="400">1641</text><text x="880" y="916" font-size="15" fill="#203342" font-weight="400">Z → 南；水平为真实距离，垂直比例另标 Y。</text><text x="90" y="974" font-size="17" fill="#203342" font-weight="400">横剖顶部色带为规划使用区：绿=私院；金=建筑搜索；赭=门前缓冲。色带不是建筑体量。</text><text x="90" y="1011" font-size="17" fill="#203342" font-weight="400">公共接触面可在现状顶面±1格范围联合探索；Builder 必须把户内外连续性与净宽同时证明。</text><text x="90" y="1048" font-size="17" fill="#203342" font-weight="400">深部保护：另有 Y81 实体位置证据；本图只画近地剖面，不把深部未知区画成可施工实心地层。</text><text x="90" y="1094" font-size="15" fill="#203342" font-weight="400">来源：MP-P04/r1 原始地表/近地调查，相关存档哈希本轮一致；接口提案 MP-P05R2/r1。</text></svg>