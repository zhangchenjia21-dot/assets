<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TT-001 · 领土划界工作台</title><link rel="stylesheet" href="Bootstrap/工作台.css">
<header><strong>TT-001 / 领土划界工作台</strong><span>南部岛屿群 · CIV-001</span><b>缓存底图 / 当前存档未复核</b></header>
<main><aside><h2>领土编辑</h2><label>目标类别<select id="category"></select></label><label>模式<select id="mode"><option value="brush">画笔</option><option value="erase">擦除 → 未分配</option><option value="rect">矩形圈选</option><option value="pan">平移</option></select></label><label>笔刷半径参数（1 = 单格）<input id="radius" type="number" value="1" min="1" max="128"></label><div class="row"><button id="undo">撤销</button><button id="redo">重做</button></div><h2>类别锁定</h2><div id="locks"></div><small>锁定同时阻止移入与移出。accepted 参考轮廓始终保留。</small><h2>底图图层</h2><label>底图<select id="base"><option value="terrain">高程 / 坡度阴影 + 海岸</option><option value="biome">Biome 参考</option><option value="plain">陆地 / 水域轮廓</option></select></label><label><input id="territory" type="checkbox" checked>领土着色</label><label>着色透明度<input id="opacity" type="range" min="0" max="1" step="0.05" value="0.65"></label><label><input id="commons" type="checkbox" checked>accepted 联盟公地</label><label><input id="connector" type="checkbox" checked>accepted connector</label><details><summary>Biome 图例</summary><div id="legend"></div></details></aside>
<section class="stage"><nav><button id="fit">全图</button><button id="one">1:1</button><button id="detail">逐格 8×</button><span id="position">X / Z</span></nav><canvas id="map" aria-label="领土编辑地图"></canvas><footer id="message" role="status">滚轮缩放；中键拖动平移。逐格模式精确选列。</footer></section>
<aside><h2>几何 QA</h2><button id="qa">重新计算 QA</button><div id="stats">等待计算</div><h2>保存与导出</h2><button id="save">保存草稿 JSON</button><label>载入同源完整 JSON<input id="load" type="file" accept=".json"></label><label>Owner 署名<input id="owner" placeholder="正式确认时填写"></label><label><input id="ack" type="checkbox">我已检查当前 QA，确认本次边界选择（含未分配、争议及 accepted 改动）</label><button id="export">导出草稿 ZIP</button><button id="confirm">确认选择并导出 ZIP</button><p><small>下载包含 current.json、preview.png、areas.md、adjacency.json、qa.md。不会自动修改 Canon 或世界。</small></p><a href="README.md" target="_blank">使用与数据契约说明</a></aside></main>
<script src="预加载/地理数据.js"></script><script src="L0_公理层/领土契约.js"></script><script src="L1_器件层/领土状态器.js"></script><script src="L1_器件层/领土质检器.js"></script><script src="L1_器件层/边界编码器.js"></script><script src="L2_流程层/领土会话.js"></script><script src="L3_外交层/领土接口.js"></script><script src="Bootstrap/工作台.js"></script></html>
